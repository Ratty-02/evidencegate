{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<section class="empty reveal">
  <img class="empty-mark float" src="/static/img/logo-mark.png" alt="">
  <span class="kicker">Error {{ code }}</span>
  <h2>{{ message }}</h2>
  {% if detail %}<p class="muted small">{{ detail }}</p>{% endif %}
  <a class="btn btn-primary" href="/disputes">Back to the case board</a>
</section>
{% endblock %}
