<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EvidenceGate{% endblock %} · EvidenceGate</title>
  <meta name="description" content="Gate the Guesswork. EvidenceGate checks every claim in a payment dispute response before it goes out.">
  <link rel="icon" href="/static/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="progress" id="scroll-progress"></div>

  <header class="topbar">
    <nav class="dock">
      <a class="brand" href="/"><img src="/static/img/logo-lockup.png" alt="EvidenceGate"></a>
      <div class="dock-links">
        <a href="/" class="{{ 'on' if request.url.path == '/' }}">Home</a>
        <a href="/disputes" class="{{ 'on' if request.url.path.startswith('/disputes') }}">Case board</a>
      </div>
      <span class="live"><i></i>{{ 'Mock PayPal data' if is_mock() else 'PayPal sandbox' }}</span>
    </nav>
  </header>

  <main class="stage">{% block content %}{% endblock %}</main>

  <footer class="foot">
    <span><strong>EvidenceGate</strong> · prototype</span>
    <span class="foot-tag">Gate the Guesswork</span>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
